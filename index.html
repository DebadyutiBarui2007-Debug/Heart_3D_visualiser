    <script>
      // Filter out benign Vite HMR WebSocket connection failure notices caused by preview iframe isolation
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('createWebSocketModuleRunnerTransport'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && String(event.reason).includes('WebSocket')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>

  </body>
